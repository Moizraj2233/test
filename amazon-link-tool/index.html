<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Amazon Script Link Finder</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#10131b;color:#edf0f8;font:15px system-ui}main{max-width:850px;margin:32px auto;padding:20px}h1{margin:0 0 6px;font-size:29px}.sub,.hint{color:#aeb5c7}.card{background:#1a1f2b;border:1px solid #303849;border-radius:15px;padding:20px;margin:16px 0}label{display:block;font-weight:650;margin:0 0 7px}input,select,textarea{width:100%;padding:12px;border-radius:9px;border:1px solid #3b465a;background:#111620;color:#fff;font:inherit;margin:0 0 14px}textarea{min-height:230px;resize:vertical}button{background:#ffbd45;color:#201800;border:0;border-radius:9px;padding:12px 18px;font-weight:750;font-size:15px;cursor:pointer}button:disabled{opacity:.5}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}#status{margin-left:12px;color:#ffcf73}.product{border-top:1px solid #303849;padding:14px 0}.product h3{margin:0 0 8px}.match{margin:9px 0;padding:10px;background:#111620;border-radius:8px}.match a{color:#8ecbff;overflow-wrap:anywhere}.hint{font-size:13px}@media(max-width:650px){.row{grid-template-columns:1fr}main{margin:8px auto;padding:14px}}
</style></head><body><main><h1>Amazon Script Link Finder</h1><p class="sub">Paste your script to find products and Amazon affiliate links.</p><section class="card"><div class="row"><div><label>Creators API Client ID</label><input id="client" autocomplete="off" placeholder="Paste Client ID"></div><div><label>Creators API Secret</label><input id="secret" type="password" autocomplete="new-password" placeholder="Paste Secret"></div></div><div class="row"><div><label>Marketplace</label><select id="market"><option value="www.amazon.com">Amazon US</option><option value="www.amazon.co.uk">Amazon UK</option><option value="www.amazon.ca">Amazon Canada</option><option value="www.amazon.de">Amazon Germany</option><option value="www.amazon.in">Amazon India</option><option value="www.amazon.com.au">Amazon Australia</option><option value="www.amazon.co.jp">Amazon Japan</option></select></div><div><label>Associates tracking tag</label><input id="tag" placeholder="yourtag-20"></div></div><label>Video script</label><textarea id="script" placeholder="Paste script here…"></textarea><button id="go">Find affiliate links</button><span id="status"></span><p class="hint">API credentials are used only for this search and are not saved by the tool. Review product matches before using links.</p></section><section class="card" id="results" hidden><button id="copy">Copy all links</button><div id="list"></div></section></main><script>
const $=id=>document.getElementById(id);$('go').onclick=async()=>{if(!$('client').value.trim()||!$('secret').value.trim()||!$('tag').value.trim()||!$('script').value.trim()){ $('status').textContent='Enter API credentials, tracking tag, and script.';return}$('go').disabled=true;$('status').textContent='Searching Amazon…';$('list').replaceChildren();try{const r=await fetch('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({clientId:$('client').value.trim(),clientSecret:$('secret').value,tag:$('tag').value.trim(),marketplace:$('market').value,script:$('script').value})});const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');for(const p of d.products){const card=document.createElement('div');card.className='product';const h=document.createElement('h3');h.textContent=p.mention;card.append(h);if(!p.matches.length){const n=document.createElement('p');n.textContent='No matches found';card.append(n)}for(const m of p.matches){const box=document.createElement('div');box.className='match';const title=document.createElement('div');title.textContent=m.title;const a=document.createElement('a');a.href=m.url;a.target='_blank';a.rel='noopener';a.textContent=m.url;box.append(title,a);card.append(box)}$('list').append(card)}$('results').hidden=false;$('status').textContent=`Found ${d.products.length} product mention(s).`; $('secret').value=''}catch(e){$('status').textContent=e.message;$('secret').value=''}finally{$('go').disabled=false}};$('copy').onclick=()=>{const text=[...$('list').querySelectorAll('.product')].map(p=>p.querySelector('h3').textContent+'\n'+[...p.querySelectorAll('a')].map(a=>a.href).join('\n')).join('\n\n');navigator.clipboard.writeText(text)};
</script></body></html>
